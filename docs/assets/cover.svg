<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Generic illustration: a chat window with a house assistant. No logo nor
       brand mark of Slack (no colored hash, no aubergine). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#1f5f7a"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.06">
    <circle cx="80" cy="80" r="46"/><circle cx="730" cy="470" r="80"/><circle cx="700" cy="70" r="26"/>
  </g>

  <!-- the chat window -->
  <g transform="translate(110 70)">
    <rect x="0" y="0" width="580" height="394" rx="22" fill="url(#win)"/>
    <rect x="0" y="0" width="580" height="60" rx="22" fill="#2f6fb5"/>
    <rect x="0" y="40" width="580" height="20" fill="#2f6fb5"/>
    <circle cx="36" cy="30" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="60" cy="30" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="84" cy="30" r="8" fill="#ffffff" opacity="0.5"/>
    <text x="290" y="39" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Slack · Gladys</text>

    <!-- member -->
    <circle cx="48" cy="112" r="22" fill="#e76f51"/>
    <circle cx="48" cy="104" r="8" fill="#ffffff" opacity="0.9"/>
    <path d="M34 124 a14 11 0 0 1 28 0z" fill="#ffffff" opacity="0.9"/>
    <rect x="86" y="88" width="300" height="50" rx="16" fill="#e4ebf2"/>
    <rect x="104" y="104" width="210" height="10" rx="5" fill="#627d98"/>
    <rect x="104" y="120" width="140" height="8" rx="4" fill="#9fb3c8"/>

    <!-- Gladys -->
    <circle cx="532" cy="200" r="22" fill="#2a9d8f"/>
    <path d="M520 202 L532 190 L544 202 V212 H520Z" fill="#ffffff"/>
    <rect x="528" y="203" width="8" height="9" fill="#2a9d8f"/>
    <rect x="214" y="176" width="292" height="50" rx="16" fill="#2a9d8f"/>
    <rect x="232" y="192" width="190" height="10" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="232" y="208" width="120" height="8" rx="4" fill="#ffffff" opacity="0.7"/>

    <!-- a light that turned on -->
    <g transform="translate(86 250)">
      <rect x="0" y="0" width="300" height="70" rx="16" fill="#e4ebf2"/>
      <circle cx="36" cy="35" r="20" fill="#f4d35e"/>
      <rect x="30" y="52" width="12" height="8" rx="2" fill="#627d98"/>
      <g stroke="#f4d35e" stroke-width="4" stroke-linecap="round">
        <line x1="36" y1="6" x2="36" y2="0"/><line x1="10" y1="35" x2="4" y2="35"/><line x1="62" y1="35" x2="68" y2="35"/>
      </g>
      <rect x="82" y="22" width="170" height="10" rx="5" fill="#627d98"/>
      <rect x="82" y="40" width="110" height="8" rx="4" fill="#9fb3c8"/>
    </g>

    <!-- input -->
    <rect x="24" y="338" width="532" height="38" rx="12" fill="#ffffff" stroke="#c9d6e3" stroke-width="2"/>
    <rect x="42" y="352" width="160" height="10" rx="5" fill="#c9d6e3"/>
    <circle cx="530" cy="357" r="12" fill="#2f6fb5"/>
    <path d="M524 351 L538 357 L524 363 L527 357Z" fill="#ffffff"/>
  </g>

  <text x="400" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#cfe3ef" text-anchor="middle">Socket Mode · no public URL · unofficial integration</text>
</svg>
